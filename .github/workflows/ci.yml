name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: node tests/installer.test.mjs
      - run: python -m compileall -q lib tools index tests
      - run: node bin/illustrator-com.mjs list
